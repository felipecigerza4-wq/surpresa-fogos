<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o Meu Amor ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050510;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .interface-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
            text-align: center;
            max-width: 420px;
            width: 90%;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .interface-container.esconder {
            opacity: 0;
            transform: scale(0.8) translateY(-50px);
            pointer-events: none;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        p {
            color: #ddccdb;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-surpresa {
            background: linear-gradient(45deg, #ff0055, #ff5500);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 0, 85, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-surpresa:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.6);
        }

        .mensagem-final {
            position: absolute;
            z-index: 5;
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transform: scale(0.5);
            transition: all 2s ease;
            text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
            pointer-events: none;
        }

        .mensagem-final.mostrar {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>
    <canvas id="canvasFogos"></canvas>
    <div class="interface-container" id="painel">
        <h1>Para alguém inesquecível... ✨</h1>
        <p>Preparei uma surpresa especial no céu desta página. Aumente o brilho da tela e clique no botão abaixo.</p>
        <button class="btn-surpresa" onclick="iniciarShow()">Ver Surpresa</button>
    </div>
    <div class="mensagem-final" id="textoFinal">Para Sempre. ❤️</div>

    <script>
        const canvas = document.getElementById('canvasFogos');
        const ctx = canvas.getContext('2d');

        function redimensionar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionar);
        redimensionar();

        let particulas = [];
        let fogos = [];
        let animacaoAtiva = false;

        const mapaTexto = [
            {x: -160, y: -50}, {x: -140, y: -50}, {x: -120, y: -50}, {x: -100, y: -50}, {x: -80, y: -50},
            {x: -120, y: -30}, {x: -120, y: -10}, {x: -120, y: 10}, {x: -120, y: 30}, {x: -120, y: 50},
            {x: -50, y: -50}, {x: -30, y: -50}, {x: -10, y: -50},
            {x: -50, y: -30}, {x: -50, y: -10}, {x: -30, y: -10},
            {x: -50, y: 10}, {x: -50, y: 50}, {x: -30, y: 50}, {x: -10, y: 50},
            {x: 20, y: 50}, {x: 30, y: 20}, {x: 40, y: -10}, {x: 50, y: -40}, {x: 60, y: -40}, {x: 70, y: -10}, {x: 80, y: 20}, {x: 90, y: 50},
            {x: 35, y: 10}, {x: 50, y: 10}, {x: 65, y: 10},
            {x: 110, y: 50}, {x: 110, y: 20}, {x: 110, y: -10}, {x: 110, y: -40},
            {x: 125, y: -20}, {x: 140, y: 0}, {x: 155, y: -20},
            {x: 170, y: -40}, {x: 170, y: -10}, {x: 170, y: 20}, {x: 170, y: 50},
            {x: 210, y: -20}, {x: 220, y: -40}, {x: 240, y: -40}, {x: 250, y: -20},
            {x: 200, y: 0}, {x: 260, y: 0},
            {x: 200, y: 20}, {x: 260, y: 20},
            {x: 210, y: 40}, {x: 220, y: 50}, {x: 240, y: 50}, {x: 250, y: 40}
        ];

        class Particula {
            constructor(x, y, cor, alvoX = null, alvoY = null) {
                this.x = x;
                this.y = y;
                this.cor = cor;
                this.alvoX = alvoX;
                this.alvoY = alvoY;
                
                if (alvoX !== null) {
                    this.vx = (alvoX - x) / (60 + Math.random() * 20);
                    this.vy = (alvoY - y) / (60 + Math.random() * 20);
                    this.vulneravel = false;
                    this.alfa = 1;
                    this.tamanho = 2.5;
                } else {
                    const angulo = Math.random() * Math.PI * 2;
                    const velocidade = Math.random() * 6 + 2;
                    this.vx = Math.cos(angulo) * velocidade;
                    this.vy = Math.sin(angulo) * velocidade;
                    this.gravidade = 0.12;
                    this.alfa = 1;
                    this.decay = Math.random() * 0.015 + 0.015;
                    this.tamanho = Math.random() * 2 + 1;
                }
            }

            atualizar() {
                if (this.alvoX !== null) {
                    const distDX = this.alvoX - this.x;
                    const distDY = this.alvoY - this.y;
                    if (Math.abs(distDX) > 1 || Math.abs(distDY) > 1) {
                        this.x += this.vx;
                        this.y += this.vy;
                    } else {
                        this.x = this.alvoX + Math.sin(Date.now() * 0.005 + this.alvoY) * 0.3;
                    }
                } else {
                    this.vy += this.gravidade;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.alfa -= this.decay;
                }
            }

            desenhar() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alfa);
                ctx.fillStyle = this.cor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.tamanho, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FogoDeArtificio {
            constructor(alvoX, alvoY, especial = false) {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.alvoX = alvoX;
                this.alvoY = alvoY;
                this.especial = especial;
                this.velocidade = Math.random() * 3 + 9;
                const angulo = Math.atan2(alvoY - this.y, alvoX - this.x);
                this.vx = Math.cos(angulo) * this.velocidade;
                this.vy = Math.sin(angulo) * this.velocidade;
                this.cor = `hsl(${Math.random() * 360}, 100%, 65%)`;
                if(especial) this.cor = '#ff0055';
                this.vivo = true;
            }

            atualizar() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.vy >= 0 || this.y <= this.alvoY) {
                    this.vivo = false;
                    this.explodir();
                }
            }

            desenhar() {
                ctx.fillStyle = this.cor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            explodir() {
                if (this.especial) {
                    mapaTexto.forEach(ponto => {
                        const posX = canvas.width / 2 + ponto.x;
                        const posY = canvas.height / 2.3 + ponto.y;
                        particulas.push(new Particula(this.x, this.y, '#ff3366', posX, posY));
                        particulas.push(new Particula(this.x, this.y, '#ffffff', posX + 1, posY + 1));
                    });
                } else {
                    for (let i = 0; i < 60; i++) {
                        particulas.push(new Particula(this.x, this.y, this.cor));
                    }
                }
            }
        }

        function iniciarShow() {
            document.getElementById('painel').classList.add('esconder');
            
            if (!animacaoAtiva) {
                animacaoAtiva = true;
                
                setTimeout(() => {
                    for (let i = 0; i < 8; i++) {
                        setTimeout(() => {
                            fogos.push(new FogoDeArtificio(
                                canvas.width * 0.2, 
                                canvas.height * 0.3
                            ));
                        }, i * 100);
                    }
                }, 500);

                setTimeout(() => {
                    for (let i = 0; i < 8; i++) {
                        setTimeout(() => {
                            fogos.push(new FogoDeArtificio(
                                canvas.width * 0.8, 
                                canvas.height * 0.3
                            ));
                        }, i * 100);
                    }
                }, 1500);

                setTimeout(() => {
                    fogos.push(new FogoDeArtificio(
                        canvas.width / 2, 
                        canvas.height / 2.3,
                        true
                    ));
                }, 2500);

                setTimeout(() => {
                    document.getElementById('textoFinal').classList.add('mostrar');
                }, 5500);
            }
        }

        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            fogos = fogos.filter(fogo => {
                fogo.atualizar();
                if (fogo.vivo) {
                    fogo.desenhar();
                    return true;
                }
                return false;
            });

            particulas = particulas.filter(particula => {
                particula.atualizar();
                if (particula.alfa > 0 || particula.alvoX !== null) {
                    particula.desenhar();
                    return true;
                }
                return false;
            });

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
